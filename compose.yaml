name: zyra

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zyra
      POSTGRES_USER: zyra
      POSTGRES_PASSWORD: zyra_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyra -d zyra"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - zyra-db:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./zyra-api
    environment:
      ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://zyra:zyra_local_only@db:5432/zyra?sslmode=disable
      JWT_SECRET: local-docker-development-secret-change-before-deployment
      AUTO_MIGRATE: "true"
      APP_ENV: development
      DEV_ADMIN_LOGIN: "true"
      DEV_ADMIN_CONTAINER: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./zyra-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  zyra-db:
